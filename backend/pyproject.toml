[project]
name = "linkedin-ai-autopilot-backend"
version = "0.1.0"
description = "Backend API for LinkedIn AI Autopilot"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16,<2",
    "celery[redis]>=5.5,<6",
    "fastapi>=0.116,<1",
    "email-validator>=2.2,<3",
    "httpx>=0.28,<1",
    "cryptography>=45,<47",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<7",
    "python-json-logger>=3.3,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
