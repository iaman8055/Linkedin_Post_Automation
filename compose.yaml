services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker-publishing:
    build:
      context: ./backend
    env_file: .env
    command: ["uv", "run", "celery", "-A", "workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=publishing", "--hostname=publishing@%h"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-ai:
    build:
      context: ./backend
    env_file: .env
    command: ["uv", "run", "celery", "-A", "workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=ai", "--hostname=ai@%h"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-background:
    build:
      context: ./backend
    env_file: .env
    command: ["uv", "run", "celery", "-A", "workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--queues=default,research,analytics,notifications", "--hostname=background@%h"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ./backend
    env_file: .env
    command: ["uv", "run", "celery", "-A", "workers.celery_app:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: linkedin_autopilot
      POSTGRES_USER: linkedin
      POSTGRES_PASSWORD: linkedin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkedin -d linkedin_autopilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
